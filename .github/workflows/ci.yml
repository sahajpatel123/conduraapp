name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  # ---------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "${{ env.GOLANGCI_LINT_VERSION }}"

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  # ---------------------------------------------------------------
  # Test (host OS: ubuntu, single arch)
  # ---------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64]
        include:
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux CGO dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Verify modules
        shell: bash
        run: go mod verify

      # Test focuses on the daemon (Go) packages. The Wails shell and the
      # Wails embed package require the Wails toolchain + built frontend
      # dist/ to compile — both are produced by the gui-build job.
      # Excluding them here matches the existing exclusion pattern
      # (internal/hotkey, internal/tray) and keeps the test matrix green.
      - name: Run go vet
        shell: bash
        run: go vet $(go list ./... | grep -v -E 'internal/hotkey|internal/tray|condura-app/cmd/condura-gui|condura-gui/frontend/')

      - name: Run unit tests (Linux - skip CGO packages)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -race -count=1 -short -tags synaptictest -timeout=300s -coverprofile=coverage.out -covermode=atomic \
            $(go list ./... | grep -v -E 'internal/hotkey|internal/tray')

      - name: Run unit tests (macOS/Windows - all packages)
        if: runner.os != 'Linux'
        shell: bash
        run: go test -race -count=1 -short -tags synaptictest -timeout=300s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage (safety packages)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Report-only: monorepo package paths are condura-app/internal/...
          # Soft floor 80% — warn if below; do not fail the job (coverage
          # varies by OS build tags and is tracked, not gated).
          if [ ! -f coverage.out ]; then
            echo "No coverage.out — skip"
            exit 0
          fi
          for pkg in \
            github.com/sahajpatel123/conduraapp/condura-app/internal/llm \
            github.com/sahajpatel123/conduraapp/condura-app/internal/ipc \
            github.com/sahajpatel123/conduraapp/condura-app/internal/daemon \
            github.com/sahajpatel123/conduraapp/condura-app/internal/config \
            github.com/sahajpatel123/conduraapp/condura-app/internal/secrets \
            github.com/sahajpatel123/conduraapp/condura-app/internal/gatekeeper \
            github.com/sahajpatel123/conduraapp/condura-app/internal/audit; do
            line=$(go tool cover -func=coverage.out | grep "$pkg" | tail -1 || true)
            if [ -n "$line" ]; then
              cov=$(echo "$line" | awk '{print $NF}')
              echo "Coverage $pkg: $cov"
            else
              echo "Coverage $pkg: (no statements matched)"
            fi
          done

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.arch }}
          path: coverage.out
          retention-days: 14

  # ---------------------------------------------------------------
  # Build verification (all platforms)
  # ---------------------------------------------------------------
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build condurad
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o condurad-${{ matrix.goos }}-${{ matrix.goarch }} ./condura-app/cmd/condurad

      - name: Build condura CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o condura-${{ matrix.goos }}-${{ matrix.goarch }} ./condura-app/cmd/condura

      - name: Build condura-tui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o condura-tui-${{ matrix.goos }}-${{ matrix.goarch }} ./condura-app/cmd/condura-tui

      - name: Verify binary exists
        run: |
          ls -la condurad-${{ matrix.goos }}-${{ matrix.goarch }}
          ls -la condura-${{ matrix.goos }}-${{ matrix.goarch }}
          ls -la condura-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          # Linux/macOS: file command
          if [ "${{ matrix.goos }}" != "windows" ]; then
            file condurad-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: condura-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            condurad-${{ matrix.goos }}-${{ matrix.goarch }}
            condura-${{ matrix.goos }}-${{ matrix.goarch }}
            condura-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  # ---------------------------------------------------------------
  # Frontend unit tests + package-manager hygiene (every PR/push).
  # ---------------------------------------------------------------
  frontend-test:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dual lockfile guard
        run: make check-lockfiles

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: condura-gui/frontend/package-lock.json

      - name: Install + test
        working-directory: condura-gui/frontend
        run: |
          npm ci
          npm test

  # ---------------------------------------------------------------
  # GUI build (Wails). Catches regressions in condura-gui/ that the
  # daemon-side build steps would miss. Only runs on main (not
  # PRs) and on the user's primary dev platform (macOS arm64) to
  # keep CI fast — the release workflow still builds GUI on every
  # supported platform.
  # ---------------------------------------------------------------
  gui-build:
    name: GUI Build (darwin/arm64) [smoke]
    runs-on: macos-latest
    env:
      GOTOOLCHAIN: local
    # Smoke check only. The real GUI build (with installer packaging,
    # code signing, etc.) runs in release.yml on tag push.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            condura-app/cmd/condura-gui/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: condura-gui/frontend/package-lock.json

      - name: Build GUI (smoke)
        shell: bash
        env:
          GOOS: darwin
          GOARCH: arm64
          VERSION: ci-${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          # Smoke build only — don't run the full installer packaging on
          # every push. release.yml handles that.
          #
          # Frontend lives at condura-gui/frontend/ and vite writes to
          # assets/dist (embedded via //go:embed). Pre-build the frontend,
          # then compile with wails -s (skip internal frontend step).
          if ! command -v wails >/dev/null 2>&1; then
            echo "installing wails CLI..."
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
            export PATH="$(go env GOPATH)/bin:${PATH}"
          fi
          (cd condura-gui/frontend && npm ci && npm run build)
          # Verify the frontend bundle is fresh: it exists, is
          # non-empty, and is newer than HEAD. This catches the
          # same "stale build" race (npm cache + git checkout
          # ordering) that the previous lp-nav-row class-grep
          # tried to catch, without coupling the guardrail to a
          # specific class name in the bundle. The class-grep
          # broke whenever the GUI was redesigned (the lp-nav-row
          # class was removed by the style(about) sweep); this
          # version is purely about file recency.
          BUNDLE=$(ls -t condura-gui/frontend/assets/dist/assets/*.js 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ] || [ ! -s "$BUNDLE" ]; then
            echo "::error::frontend bundle missing or empty — npm run build did not produce output" >&2
            exit 1
          fi
          COMMIT_MTIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          BUNDLE_MTIME=$(stat -c %Y "$BUNDLE" 2>/dev/null || stat -f %m "$BUNDLE" 2>/dev/null || echo 0)
          if [ -n "$COMMIT_MTIME" ] && [ "$COMMIT_MTIME" -gt 0 ] && [ "$BUNDLE_MTIME" -lt "$COMMIT_MTIME" ]; then
            echo "::error::frontend bundle is older than HEAD — npm run build is stale" >&2
            echo "::error::  bundle mtime:  $(date -d @$BUNDLE_MTIME 2>/dev/null || date -r $BUNDLE_MTIME 2>/dev/null)" >&2
            echo "::error::  commit mtime: $(date -d @$COMMIT_MTIME 2>/dev/null || date -r $COMMIT_MTIME 2>/dev/null)" >&2
            exit 1
          fi
          BUNDLE_SIZE=$(wc -c < "$BUNDLE" 2>/dev/null | tr -d ' ')
          echo "frontend bundle OK: $(basename "$BUNDLE") (${BUNDLE_SIZE} bytes)"
          cd condura-app/cmd/condura-gui
          GOTOOLCHAIN=local wails build -clean -trimpath -s -platform darwin/arm64 \
            -ldflags "-s -w -X github.com/sahajpatel123/conduraapp/condura-app/internal/version.Version=${VERSION} -X github.com/sahajpatel123/conduraapp/condura-app/internal/version.Commit=${COMMIT}" || {
              echo "::warning::wails CLI build failed; falling back to plain Go build"
              go build -trimpath -ldflags "-s -w -X github.com/sahajpatel123/conduraapp/condura-app/internal/version.Version=${VERSION} -X github.com/sahajpatel123/conduraapp/condura-app/internal/version.Commit=${COMMIT}" -o /tmp/condura-gui-smoke .
            }

      - name: Verify GUI build artifact
        shell: bash
        run: |
          # Wails output is build/bin/<name>.app. If the wails CLI
          # was unavailable we fall back to a plain binary at /tmp.
          if [ -d condura-app/cmd/condura-gui/build/bin/condura.app ]; then
            echo "GUI build OK: condura.app produced"
            ls -la condura-app/cmd/condura-gui/build/bin/condura.app/Contents/MacOS/
          elif [ -d condura-app/cmd/condura-gui/build/bin/web.app ]; then
            echo "GUI build OK: web.app produced"
            ls -la condura-app/cmd/condura-gui/build/bin/web.app/Contents/MacOS/
          elif [ -f /tmp/condura-gui-smoke ]; then
            echo "GUI smoke fallback OK: plain Go binary built"
            file /tmp/condura-gui-smoke
          else
            echo "::error::GUI build produced no artifact"
            exit 1
          fi

  # ---------------------------------------------------------------
  # Integration tests (only on main, after unit tests pass)
  # ---------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build daemon
        run: go build -o condurad ./condura-app/cmd/condurad

      - name: Build CLI
        run: go build -o condura ./condura-app/cmd/condura

      - name: Daemon smoke test (boot + RPC)
        run: go test -count=1 -timeout=180s -run TestDaemonSmoke ./condura-app/cmd/condurad/

      - name: Run integration tests
        run: |
          # Real integration package lives under condura-app/test (Makefile test-integration).
          # go list exits 0 with "matched no packages" — check for real package paths.
          pkgs=$(go list -tags=integration ./condura-app/test/... 2>/dev/null || true)
          if [ -z "$pkgs" ]; then
            echo "No integration-tagged packages under ./condura-app/test — skipping"
            exit 0
          fi
          echo "Running: $pkgs"
          go test -race -count=1 -timeout=300s -tags=integration $pkgs

  # ---------------------------------------------------------------
  # Security: govulncheck
  # ---------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libayatana-appindicator3-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest $(go list ./... | grep -v -E 'internal/hotkey|internal/tray')
